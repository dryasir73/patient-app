<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b40d9">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="برنامجي العلاجي">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>برنامج مريض تزحزح الفقرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: أنيق، هادئ، سريري — تطبيق علاجي شخصي
   IDEA: دفتر علاج تفاعلي: صفحة رئيسية بأقسام، كل قسم صفحة مستقلة برجوع واضح
   PICTURE: فقرات تنزلق حسب الدرجة + شخصية متحركة تؤدي كل تمرين بعمق وظل
   COLOUR and TYPE: تدرّج أزرق ملكي → بنفسجي، أرضية لافندر فاتحة، ذهبي للعضلات العاملة؛ IBM Plex Sans Arabic بوزن 500/700 وحجم 19px
   LAYOUT: شريط علوي ثابت (رجوع، عنوان، ملء الشاشة) + صفحات تتبدل بنعومة */
:root{color-scheme:light dark;
--bg:light-dark(#f7f6fe,#0d0c24);--ink:light-dark(#1b1840,#eeedff);--mut:light-dark(#4f4c72,#b9b6dc);
--card:light-dark(#ffffff,#17153b);--line:light-dark(#e3e0f7,#2c2960);--soft:light-dark(#eeebff,#221f52);
--go:light-dark(#2350d8,#9db8ff);--no:light-dark(#c92b5f,#ff8ab0);--acc:light-dark(#4b3fd6,#b9a8ff);
--grad:linear-gradient(120deg,#1d3fc4 0%,#3b40d9 38%,#6a3de0 72%,#8d45e6 100%)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 19px/1.85 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
h1,h2,h3,b{font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(5vw,16px)}
.top{position:sticky;top:0;z-index:20;background:var(--grad);color:#fff;box-shadow:0 6px 24px #2a1f8a33}
.tbar{display:flex;align-items:center;gap:10px;min-height:64px}
.tbar .ttl{flex:1;font-weight:700;font-size:20px;background:none;border:0;color:#fff;text-align:start;padding:0;min-height:44px;cursor:pointer;font-family:inherit}
.ib{width:46px;height:46px;border-radius:14px;border:1.5px solid #ffffff55;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,button:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
.hid{visibility:hidden}
.view{display:none;padding-bottom:56px}.view.on{display:block;animation:vin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}}
.hero{background:var(--grad);color:#fff;padding:clamp(26px,4vw,56px) 0 clamp(30px,4vw,60px)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);grid-template-areas:"t f" "c f";gap:6px 40px;align-items:start}
.htext{grid-area:t}.spine{grid-area:f;position:relative;min-height:340px;background:#ffffff14;border:1px solid #ffffff30;border-radius:24px}.ctrl{grid-area:c}
h1{font-size:clamp(36px,5.2vw,54px);line-height:1.1;margin:0 0 12px;text-wrap:balance}
.lead{margin:0 0 22px;color:#e4e1ff;max-width:54ch;font-size:19px}
.grp{margin:0 0 16px;border:0;padding:0}
.grp legend{font-weight:700;margin-bottom:8px;font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:48px;padding:9px 18px;border-radius:14px;border:1.5px solid #ffffff66;cursor:pointer;font-weight:600;display:flex;align-items:center;transition:background .25s,color .25s}
.seg input:checked+label{background:#fff;color:#2c2a9a;border-color:#fff;font-weight:700}
.seg input:focus-visible+label{outline:3px solid #ffd27a;outline-offset:2px}
.spine svg{position:absolute;inset:14px 14px 44px;width:calc(100% - 28px);height:calc(100% - 58px)}
.slip{transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.legend{position:absolute;bottom:10px;inset-inline:16px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:#e4e1ff}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:-26px;position:relative}
.tile{display:flex;gap:16px;align-items:center;text-align:start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:20px;cursor:pointer;font:inherit;box-shadow:0 10px 30px #3b2fa014;transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 36px #3b2fa026}
.tile .ic{width:58px;height:58px;border-radius:18px;background:var(--grad);display:grid;place-items:center;flex:none}
.tile .ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:21px;line-height:1.35}.tile span{color:var(--mut);font-size:16px;line-height:1.6}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:26px 0 8px}
.vhead h2{flex:1 1 260px;margin:0;font-size:clamp(28px,3.6vw,38px);line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{background:var(--soft);color:var(--acc);border-radius:999px;padding:4px 14px;font-size:16px;font-weight:700}
.sub{color:var(--mut);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.pc b{display:block;font-size:21px;margin-bottom:6px;line-height:1.4}.pc p{margin:0;color:var(--mut)}
.phase{margin-top:30px}.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.ph h3{margin:0;font-size:24px}.ph span{color:var(--mut);font-size:16px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.exc{display:grid;grid-template-columns:132px minmax(0,1fr) 24px;gap:14px;align-items:center;text-align:start;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.exc:hover{transform:translateY(-2px)}
.exc b{display:block;font-size:18px;line-height:1.45}
.exc>svg{width:22px;height:22px;fill:none;stroke:var(--mut);stroke-width:2.2}
.stage{position:relative;aspect-ratio:400/260;border-radius:14px;overflow:hidden}
.stage svg{display:block;width:100%;height:100%}
.dose{display:inline-block;white-space:nowrap;background:var(--soft);color:var(--acc);border-radius:10px;padding:2px 12px;font-weight:700;font-size:16px;margin-top:4px}
.note{background:var(--soft);border-radius:16px;padding:14px 18px;margin:14px 0}
.det{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.big{border-radius:22px;box-shadow:0 14px 40px #3b2fa022}
.big .ctl{position:absolute;top:12px;inset-inline-start:12px;display:flex;gap:8px}
.big .ctl .ib{background:#1d1a5ccc;border-color:#ffffff40}
.big.pfs,.big:fullscreen{position:fixed;inset:0;z-index:100;border-radius:0;aspect-ratio:auto;background:#eef0ff;display:grid;place-items:center}
.big.pfs svg,.big:fullscreen svg{width:100%;height:100%}
.steps{margin:6px 0 16px;padding-inline-start:24px}.steps li{margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px}
ul.x,ul.ok{list-style:none;padding:0;margin:0}
ul.x li,ul.ok li{padding:12px 0;border-bottom:1px solid var(--line);padding-inline-start:32px;position:relative}
ul.x li::before,ul.x li::after{content:"";position:absolute;inset-inline-start:4px;top:26px;width:16px;height:3px;border-radius:2px;background:var(--no);transform:rotate(45deg)}
ul.x li::after{transform:rotate(-45deg)}
ul.ok li::before{content:"";position:absolute;inset-inline-start:7px;top:19px;width:8px;height:14px;border:solid var(--go);border-width:0 3px 3px 0;transform:rotate(45deg)}
.life{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.life h3{margin:0 0 8px;font-size:22px}.life ul{margin:0;padding-inline-start:22px}.life li{margin:6px 0}
li.extra{color:var(--go);font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden}
th,td{text-align:start;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:16px;color:var(--mut)}td:first-child{font-weight:700;white-space:nowrap}
tr.today td{background:var(--soft)}
.flags{background:light-dark(#fff1f5,#2b1325);border:1.5px solid var(--no);border-radius:20px;padding:20px 22px}
.flags h3{color:var(--no);margin:0 0 6px;font-size:24px}
.foot{color:var(--mut);font-size:15px}
.pick{flex:none;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick span{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--acc);display:grid;place-items:center;background:var(--card);transition:background .2s,border-color .2s}
.pick svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.pick input:checked+span{background:var(--grad);border-color:transparent}.pick input:checked+span svg{opacity:1}
.pick input:focus-visible+span{outline:3px solid #ffd27a;outline-offset:2px}
.fld{display:flex;gap:10px;align-items:flex-start}.fld>div{flex:1}
.fh{display:flex;align-items:center;gap:8px}.fh h3{margin:0}
.row{display:flex;gap:6px;align-items:center}.row .exc{flex:1}
#ok{position:fixed;opacity:0;pointer-events:none}
.splash{position:fixed;inset:0;z-index:300;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto}
#ok:checked+.splash{display:none}
.sbox{max-width:540px;text-align:center}.sbox .logo{width:92px;height:92px;margin:0 auto 18px;border-radius:26px;background:#ffffff26;display:grid;place-items:center}
.sbox .logo svg{width:56px;height:56px}
.sbox h1{font-size:clamp(28px,6vw,38px);line-height:1.25;margin:0 0 16px}.sbox p{font-size:19px;margin:0 0 14px;color:#eeeaff}
.sbox .warn{background:#ffffff1f;border:1px solid #ffffff55;border-radius:16px;padding:12px 16px;font-weight:700;color:#fff}
.gobtn{display:inline-flex;margin-top:14px;min-height:56px;padding:12px 30px;border-radius:16px;background:#fff;color:#2c2a9a;font-weight:700;font-size:19px;cursor:pointer;align-items:center}
.ib{position:relative}.badge{position:absolute;top:-6px;inset-inline-start:-6px;min-width:22px;height:22px;border-radius:11px;background:#ffc24d;color:#1b1840;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tile.hot{background:var(--grad);color:#fff;border-color:transparent}.tile.hot span{color:#e8e5ff}.tile.hot .ic{background:#ffffff2a}
.shgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.fl{display:block;font-weight:700;margin-bottom:14px}
.fl input,.fl textarea{display:block;width:100%;margin-top:6px;font:inherit;font-weight:500;font-size:18px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:50px}
.fl input:focus,.fl textarea:focus{outline:3px solid #8f7bff66;border-color:var(--acc)}
.sseg label{border-color:var(--line)!important;color:var(--ink)}.sseg input:checked+label{background:var(--grad)!important;color:#fff!important;border-color:transparent!important}
.slist{list-style:none;margin:0;padding:0}.slist li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:2px 0}
.slist .gh{font-weight:700;color:var(--acc);padding-top:12px;border:0}
.shbar{position:sticky;bottom:0;z-index:10;background:var(--bg);padding:12px 0;margin-top:18px;border-top:1px solid var(--line)}
.xl{min-height:60px;font-size:20px;padding:12px 28px}
.ov{position:fixed;inset:0;z-index:250;background:#0d0c24cc;display:none;padding:12px}.ov.on{display:flex;flex-direction:column;gap:10px}
.ov iframe{flex:1;width:100%;border:0;border-radius:16px;background:#fff}
@media(max-width:860px){.shgrid{grid-template-columns:minmax(0,1fr)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:#1d1a5c;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;transition:.3s;z-index:200;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.cards,.two,.life,.det{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){body{font-size:18px}.hgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"t" "f" "c"}.spine{min-height:280px}
.exc{grid-template-columns:110px minmax(0,1fr) 20px}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 12px}.stack td::before{content:attr(data-l);color:var(--mut);font-weight:500}}
@media print{.top,.btn,.ib,.acts,.tiles{display:none!important}body{background:#fff;color:#000}.view{display:none!important}.view.on{display:block!important}}

.iv{margin-bottom:14px}.rest{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0 4px}
.rl{display:inline-flex;align-items:center;gap:10px;font-weight:700}.rin{width:86px;min-height:46px;font:inherit;font-size:18px;text-align:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.restn{background:var(--grad);color:#fff;border-radius:12px;padding:4px 14px;font-weight:700}.restd{background:var(--soft);color:var(--acc);border-radius:12px;padding:4px 14px;font-weight:700}
table.diary{margin-top:6px}table.diary td{height:40px}
.pinrow{display:flex;gap:10px;margin-top:6px}.pinrow input{flex:1;font:inherit;font-size:26px;font-weight:700;letter-spacing:.3em;text-align:center;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);min-height:54px}
.chkl{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:600;cursor:pointer}.chkl input{width:22px;height:22px;accent-color:#4b3fd6}
.res{margin-top:20px;border:2px solid var(--acc)}.resg{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:start}
.pinbig{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:12px 16px;margin:10px 0}.pinbig span{color:var(--mut);font-weight:600}.pinbig b{font-size:36px;letter-spacing:.25em;color:var(--acc)}
.qr{background:#fff;border-radius:16px;padding:8px}.qr svg{width:100%;height:auto;display:block}
.lnk{width:100%;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--mut)}
a.btn{text-decoration:none}
@media(max-width:700px){.resg{grid-template-columns:minmax(0,1fr)}.qr{max-width:240px}}

.hname{color:#fff;font-size:17px}.hname input{background:#fff;color:#1b1840;border-color:#fff;font-size:19px}
.pname{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:16px;background:var(--soft);border-color:transparent}.pname small{display:block;color:var(--mut);font-size:15px}.pname b{font-size:22px}
.trow{display:flex;gap:8px;align-items:center}.trow .tile{flex:1}.tsp{width:44px;flex:none}
.pick span{position:relative}.pick input:indeterminate+span{background:var(--soft);border-color:var(--acc)}
.pick input:indeterminate+span::before{content:"";position:absolute;width:14px;height:3px;border-radius:2px;background:var(--acc)}
.gpick{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:17px;border:1.5px solid var(--acc);border-radius:14px;padding:0 4px 0 14px;background:var(--card);min-height:50px;cursor:pointer}
.gp span{width:34px;height:34px;border-radius:10px}
.slist .gh{display:flex;align-items:center;gap:6px}
.slist li.off>span{opacity:.55}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-bottom:40px}input,textarea{-webkit-user-select:text;user-select:text}
.gate{position:fixed;inset:0;z-index:200;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;padding:28px}
.gate[hidden]{display:none}
.gbox{max-width:420px;width:100%;text-align:center}.gbox h2{font-size:30px;margin:6px 0 8px}.gbox p{color:#e8e5ff;margin:0 0 14px}
.glogo{width:84px;height:84px;margin:0 auto 14px;border-radius:24px;background:#ffffff26;display:grid;place-items:center}.glogo svg{width:52px;height:52px}
#pin{width:100%;font:700 34px/1 "IBM Plex Sans Arabic",Tahoma,sans-serif;letter-spacing:.4em;text-align:center;border:0;border-radius:16px;padding:14px;min-height:64px;color:#1b1840}
.gbox .chkl{justify-content:center;color:#fff}.gerr{color:#ffd0dd!important;font-weight:700;min-height:1.5em}.gbox .gobtn{border:0;font-family:inherit}
#app{display:block}#app[hidden],.top[hidden]{display:none}
.phero{background:var(--grad);color:#fff;padding:24px 0 54px}.phero h1{font-size:clamp(30px,6vw,46px);margin:0 0 14px}
.pinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.pinfo div{background:#ffffff1f;border-radius:14px;padding:8px 14px}.pinfo small{display:block;color:#dcd8ff;font-size:14px}.pinfo b{font-size:18px}.pinfo .w2{grid-column:span 2}
.ibanner{display:flex;gap:14px;align-items:center;width:100%;text-align:start;font:inherit;color:var(--ink);background:var(--card);border:2px dashed var(--acc);border-radius:20px;padding:14px 18px;margin:-30px 0 18px;position:relative;cursor:pointer}
.ibanner>svg{width:30px;height:30px;fill:none;stroke:var(--acc);stroke-width:2.2;flex:none}.ibanner b{display:block}.ibanner span span{color:var(--mut);font-size:16px}
.ptiles{margin-top:0}.phero+.wrap .ptiles:first-child{margin-top:-30px}
.isteps{list-style:none;padding:0;margin:0;display:grid;gap:12px}.isteps li{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.isteps i{font-style:normal;width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.isteps p{margin:2px 0 0;color:var(--mut)}
#lock{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#1d1a5ce8;color:#fff;font-size:13px;font-weight:600;text-align:center;padding:5px 10px calc(5px + env(safe-area-inset-bottom))}
.wm,.pmark{display:none}
/* الإنفوجرافيك */
.info{background:#fff;color:#1b1840;border-radius:22px;box-shadow:0 14px 40px #3b2fa022;padding:22px;max-width:820px;margin:0 auto;--g:linear-gradient(120deg,#1d3fc4,#3b40d9 38%,#6a3de0 72%,#8d45e6)}
.ih{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--g);color:#fff;border-radius:18px;padding:16px 20px}

const B64={enc:u=>{let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
 dec:t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0))}};
async function kdf(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode('tzh|'+pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:2000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pin,salt),new TextEncoder().encode(JSON.stringify(obj))));
 const o=new Uint8Array(28+ct.length);o.set(salt);o.set(iv,16);o.set(ct,28);return B64.enc(o)}
async function unseal(t,pin){const u=B64.dec(t);const k=await kdf(pin,u.slice(0,16));
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},k,u.slice(28))))}

 const no=[...NO_S[0]];for(let g=1;g<=S.grade;g++)no.push(...NO_S[g]);
 const dos=LF.map((x,i)=>SEL['life-'+i]?DO_S[i]:null).filter(Boolean);const ivs=IV.filter(v=>SEL['iv-'+v.k]);
 return `<div class="info" id="infoPage">
 <div class="ih"><div><small>برنامج مريض تزحزح الفقرات</small><h2>الملخص العلاجي</h2></div><div class="idoc">${LOGO}<span>د. ياسر الخزرجي</span></div></div>
 <div class="ipt"><div><small>المريض</small><b>${esc(PI.name)}</b></div>${PI.age?`<div><small>العمر</small><b>${esc(PI.age)} سنة</b></div>`:''}<div class="w2"><small>التشخيص</small><b>${esc(PI.dx)}</b></div><div><small>تاريخ المشاركة</small><b>${fmtD(PI.date)}</b></div></div>
 <div class="ist"><div><i>${['I','II','III+'][S.grade]}</i><span>درجة التزحزح</span></div><div><i>${S.age===0?'برزخي':'تنكّسي'}</i><span>نوع التزحزح</span></div><div><i>${S.state?'تهدئة':it}</i><span>${S.state?'المرحلة الحالية':'شدة البرنامج'}</span></div></div>
 ${ex.length?`<h3 class="ihd">تمارينك اليومية</h3><div class="iex">${ex.map(e=>`<div><div class="iimg">${snap(e.i)}</div><b>${e.n}</b><span>${dose(e)}</span></div>`).join('')}</div>`:''}
 <div class="icol">${dos.length?`<div class="ido"><h3>افعل</h3><ul>${li(dos)}</ul></div>`:''}${SEL.avoid?`<div class="ino"><h3>تجنّب</h3><ul>${li(no)}</ul></div>`:''}</div>
 ${SEL.week||SEL.today?`<h3 class="ihd">أسبوعك</h3><div class="iwk">${W.map(r=>`<div style="--c:${WC[r[3]]}"><b>${r[0]}</b><span>${TL[r[3]].replace('يوم ','')}</span></div>`).join('')}</div>`:''}
 ${ivs.length?`<div class="iiv"><h3>بعد الإجراء${PI.ivd?' ('+fmtD(PI.ivd)+')':''}</h3><ul>${li(ivs.map(v=>{const r=restOf(v.k);return `${v.n.split(' (')[0]}: ${r?'راحة نسبية '+dayW(r)+(PI.ivd?' ثم العودة للتمارين '+fmtD(addDays(PI.ivd,r)):''):'لا راحة، سجّل الألم 6 ساعات'}`}))}</ul></div>`:''}
 <div class="ifl"><h3>راجع الطبيب فوراً عند</h3><p>فقدان السيطرة على البول أو البراز · تنميل منطقة الجلوس · ضعف متزايد في الساق · حرارة بعد حقنة · ألم ليلي شديد لا يتغيّر</p></div>
 <div class="ift">أُعدّ خصيصاً للمريض ${esc(PI.name)} بتاريخ ${fmtD(PI.date)} من قبل الدكتور ياسر الخزرجي، ولا يجوز استخدامه بدون استشارة الطبيب.</div></div>`}

/* ---------- الصفحات ---------- */
const vh=(t,pk_)=>`<div class="vhead"><button class="btn" data-back>${ic('back')}رجوع</button><h2>${t}</h2><button class="btn pri" data-pr="${pk_||''}">${ic('print')}طباعة</button></div>`;
const PV={
 info:['الملخص المطبوع',()=>`<p class="sub">ملخص أنيق في صفحة واحدة لكل ما يخصك. اضغط "طباعة" لطباعته أو حفظه PDF.</p>${infoHTML()}`,()=>1,'info'],
 prof:['حالتك',()=>profileHTML(),()=>SEL.profile],
 ex:['تمارينك',()=>{const m=mine();
  let h=`<p class="sub">${S.state?'أنت في هجمة ألم: نفّذ تمارين المرحلة الأولى فقط حتى يهدأ الألم بشكل واضح (عادة خلال 1–2 أسبوع)، ثم راجع الطبيب ليحدّث برنامجك.':'انتقل إلى المرحلة التالية فقط عندما تؤدي التمارين دون أن يزيد الألم في اليوم التالي. ابدأ كل جلسة بتمارين المرحلة الأولى كإحماء.'} اضغط على أي تمرين لتراه كبيراً. الوهج الذهبي يوضح متى تكون عضلات الجذع العميقة مشدودة. توقّف عن أي تمرين يسبب ألماً نازلاً في الساق أو تنميلاً.</p>`;
  h+=(S.state?[1]:[1,2,3]).map(p=>{const L=m.filter(e=>e.p===p);return L.length?`<div class="phase"><div class="ph"><h3>${PH[p][0]}</h3><span>${PH[p][1]}</span></div>${p===3&&S.grade===2?'<div class="note">في درجتك: تمارين هذه المرحلة تحت إشراف معالج طبيعي فقط.</div>':''}<div class="exgrid">${L.map(card0).join('')}</div></div>`:''}).join('');
  h+=S.state?`<div class="note">مع الهجمة: كمادة دافئة 15–20 دقيقة، والمسكن الذي يصفه طبيبك، ومشي قصير كل ساعتين. إذا لم يتحسّن الألم خلال أسبوعين، أو نزل إلى الساق، فراجع الطبيب.</div>`:`<div class="phase"><div class="ph"><h3>${PH[4][0]}</h3><span>${PH[4][1]}</span></div><div class="note">حافظ يومياً على "الثلاثي الذهبي": McGill curl-up، واللوح الجانبي، وBird-dog (حوالي 10 دقائق). أضف نشاطاً هوائياً ${['150–300','150','100–150'][S.age]} دقيقة أسبوعياً، وتمارين التقوية مرتين أسبوعياً.</div></div>`;
  return h},()=>mine().length],
 plan:['منهاجي',()=>{const W=week(),t=todayI(),r=W[t];const L=dayEx(r[3]).filter(e=>SEL['ex-'+e.i]);
  return `${SEL.today?`<div class="note"><b>اليوم ${r[0]}: ${TL[r[3]]}</b><br>${r[1]}. النشاط الهوائي: ${r[2]}.</div>${L.length?`<div class="exgrid">${L.map(card0).join('')}</div>`:''}`:''}${SEL.week?`<h3 style="margin-top:26px">جدول الأسبوع</h3><table class="stack"><thead><tr><th>اليوم</th><th>التمارين</th><th>النشاط الهوائي</th></tr></thead><tbody>${W.map((x,i)=>`<tr class="${i===t?'today':''}"><td data-l="اليوم">${x[0]}</td><td data-l="التمارين">${x[1]}</td><td data-l="الهوائي">${x[2]}</td></tr>`).join('')}</tbody></table>`:''}`},()=>SEL.today||SEL.week],
 avoid:['الممنوع والمسموح',()=>avoidHTML(),()=>SEL.avoid||SEL.sports],
 life:['نمط حياتك',()=>lifeHTML(),()=>any('life-')],
 post:['بعد التداخل',()=>postHTML(),()=>any('iv-')],
 flags:['الخطر والمتابعة',()=>flagsHTML(),()=>SEL.flags||SEL.follow],
 inst:['تثبيت البرنامج',()=>instHTML(),()=>!standalone()&&!window.__CFG]};
const TI={info:['img','الملخص المطبوع','كل ما يخصك في صفحة واحدة'],prof:['user','حالتك','نوع التزحزح ودرجته'],ex:['move','تمارينك','تمارين متحركة بجرعاتك'],plan:['cal','منهاجي','اليوم والأسبوع'],avoid:['shield','الممنوع والمسموح','حركات تتجنّبها ورياضات تناسبك'],life:['home','نمط حياتك','العمل والجلوس والنوم والغذاء'],post:['needle','بعد التداخل','الراحة وتعليمات ما بعد الحقنة'],flags:['alert','الخطر والمتابعة','متى تراجع الطبيب فوراً'],inst:['share','تثبيت البرنامج','أيقونة على شاشتك الرئيسية']};
function instHTML(){const d=CFG.dv||'ios',ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const steps={ios:[['افتحه في Safari','إذا فُتح الرابط داخل واتساب، اضغط ⋯ أو زر البوصلة واختر "فتح في Safari".'],['اضغط زر المشاركة','المربع الذي فيه سهم للأعلى، أسفل الشاشة أو بجانب شريط العنوان.'],['إضافة إلى الشاشة الرئيسية','مرّر القائمة للأسفل واختر "إضافة إلى الشاشة الرئيسية"، ثم "إضافة".'],['افتحه من أيقونته','ستجد أيقونة "برنامجي العلاجي" على شاشتك. افتحه منها دائماً.']],
  and:[['افتحه في Chrome','إذا فُتح الرابط داخل واتساب، اضغط ⋮ واختر "فتح في Chrome".'],['ثبّت التطبيق','اضغط زر "ثبّت الآن" أدناه إن ظهر، أو من القائمة ⋮ اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".'],['وافق على التثبيت','ستظهر أيقونة "برنامجي العلاجي" بين تطبيقاتك.']],
  pc:[['افتحه في Chrome أو Edge','انسخ الرابط والصقه في المتصفح.'],['اضغط أيقونة التثبيت','في يسار شريط العنوان (شاشة عليها سهم)، أو من القائمة ⋮ اختر "تثبيت برنامجي العلاجي".'],['أو احفظه في المفضلة','إذا لم يظهر خيار التثبيت، احفظ الصفحة في المفضلة.']]};
 return `<p class="sub">جهازك حسب ما حدّده الطبيب: <b>${DV[d]}</b>.${d==='ios'&&!isIOS?' يبدو أنك تفتحه من جهاز آخر، فاتبع الخطوات المناسبة لجهازك.':''}</p>
 <ol class="isteps">${steps[d].map((s,i)=>`<li><i>${i+1}</i><div><b>${s[0]}</b><p>${s[1]}</p></div></li>`).join('')}</ol>
 <button class="btn pri xl" id="instNow"${bip?'':' hidden'}>${ic('share')}ثبّت الآن</button>
 <details class="pc" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">خطوات الأجهزة الأخرى</summary>${Object.keys(steps).filter(k=>k!==d).map(k=>`<h4>${DV[k]}</h4><ol>${li(steps[k].map(s=>`<b>${s[0]}:</b> ${s[1]}`))}</ol>`).join('')}</details>`}
function homeHTML(){const keys=Object.keys(PV).filter(k=>PV[k][2]());
 return `<div class="phero"><div class="wrap"><h1>برنامجك العلاجي</h1><div class="pinfo"><div><small>المريض</small><b>${esc(PI.name)}</b></div>${PI.age?`<div><small>العمر</small><b>${esc(PI.age)} سنة</b></div>`:''}<div class="w2"><small>التشخيص</small><b>${esc(PI.dx)}</b></div><div><small>تاريخ المشاركة</small><b>${fmtD(PI.date)}</b></div><div><small>الطبيب المعالج</small><b>د. ياسر الخزرجي</b></div></div></div></div>
 <div class="wrap">${PV.inst[2]()?`<button class="ibanner" data-go="inst">${ic('share')}<span><b>ثبّت البرنامج على ${DV[CFG.dv||'ios']}</b><span>ليفتح كتطبيق من شاشتك الرئيسية</span></span></button>`:''}
 <div class="tiles ptiles">${keys.filter(k=>k!=='inst').map(k=>`<button class="tile${k==='info'?' hot':''}" data-go="${k}"><span class="ic">${ic(TI[k][0])}</span><span><b>${TI[k][1]}</b><span>${TI[k][2]}</span></span></button>`).join('')}</div></div>`}
function exHTML(i){const e=EX[i],m=mine(),pos=m.findIndex(x=>x.i===i),prv=m[pos-1],nxt=m[pos+1],steps=e.h.split('. ').map(s=>s.replace(/\.$/,'')).filter(Boolean);
 return `<div class="wrap">${vh(e.n,'x')}<div class="det"><div><div class="stage big" data-ex="${i}" id="bigst"><div class="ctl"><button class="ib" data-pp aria-label="إيقاف مؤقت">${ic('pause')}</button></div></div></div>
 <div><span class="dose" style="font-size:20px;padding:6px 16px">${dose(e)}</span><p class="sub" style="margin:10px 0 0">${PH[e.p][0]}</p><ol class="steps">${li(steps)}</ol>
 ${S.age===2&&e.o?`<div class="note">${e.o}</div>`:''}${S.grade===2?'<div class="note">نفّذ هذا التمرين كما راجعه معك المعالج.</div>':''}
 <div class="acts">${prv?`<button class="btn" data-rep="x-${prv.i}">${ic('prev')}السابق</button>`:''}${nxt?`<button class="btn" data-rep="x-${nxt.i}">التالي${ic('next')}</button>`:''}</div></div></div></div>`}

let cur='home';const stack=[];
function show(name){const a=$('app');let h;
 if(name.startsWith('x-')&&SEL['ex-'+name.slice(2)]&&fitEx(EX[+name.slice(2)]))h=exHTML(+name.slice(2));
 else if(PV[name]&&PV[name][2]())h=`<div class="wrap">${vh(PV[name][0],PV[name][3])}${PV[name][1]()}</div>`;
 else{name='home';h=homeHTML()}
 a.innerHTML=h;a.className='on';$('bk').classList.toggle('hid',name==='home');const prev=cur;cur=name;
 if(name==='home'&&prev!=='home'){const tl=document.querySelector(`.tile[data-go="${prev.startsWith('x-')?'ex':prev}"]`);if(tl){tl.scrollIntoView({block:'center'});return}}scrollTo(0,0)}
function go(n){stack.push(cur);location.hash=n}
function back(){const p=stack.pop()||(cur.startsWith('x-')?'ex':'home');location.hash=p}
addEventListener('hashchange',()=>show(location.hash.slice(1)||'home'));
function boot(){if(CFG.e&&td()>CFG.e)return gate('expired');
 $('gate').hidden=true;$('app').hidden=false;$('top').hidden=false;marks();
 TZE.loop(()=>document.querySelectorAll('#app .stage'),()=>TZE.isDark()?TZE.PAL.d:TZE.PAL.l);show(location.hash.slice(1)||'home')}

/* ---------- الأحداث ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.go)go(t.dataset.go);else if(t.dataset.rep)location.replace('#'+t.dataset.rep);
 else if(t.hasAttribute('data-back')||t.id==='bk')back();else if(t.id==='home'){stack.length=0;location.hash='home'}
 else if(t.dataset.pr!==undefined)pr(t.dataset.pr);
 else if(t.hasAttribute('data-pp')){const st=$('bigst');st._paused=!st._paused;if(!st._paused)st._off=performance.now()-st._pt;t.innerHTML=ic(st._paused?'play':'pause')}
 else if(t.id==='instNow'&&bip){bip.prompt();bip.userChoice.finally(()=>{bip=null;t.hidden=true})}});
document.addEventListener('submit',e=>e.preventDefault());
['contextmenu','copy','cut','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()}));
addEventListener('pageshow',()=>{const o=$('ok');if(o)o.checked=false});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.__CFG)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();

}
</script>
</body>
</html>
