<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#E3F1FC;--blue:#CFE8FA;--blue-2:#B9DDF7;--green:#DDF5E3;--green-2:#BFE9CB;--green-ink:#11603A;--yellow:#FFF6C7;--yellow-2:#FBE7A1;
 --ink:#0B1A22;--muted:#2E4450;--qred:#8B0000;--red-bg:#FDE3E1;--line:#A9CBE0;--white:#FFFFFF;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:20px;font-weight:700;line-height:1.7;
 padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 54px);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green-ink);outline-offset:2px}
.top{background:var(--blue);border-bottom:2px solid var(--blue-2);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.seal{width:42px;height:42px;border-radius:12px;background:var(--green);border:2px solid var(--green-2);color:var(--green-ink);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.top b{display:block;font-size:19px;font-weight:900;line-height:1.3}
.top small{display:block;font-size:15px;color:var(--muted);line-height:1.3}
.top .grow{flex:1;min-width:0}
.vbtn{border:2px solid var(--green-2);background:var(--green);color:var(--green-ink);border-radius:12px;padding:6px 12px;font-weight:800;font-size:16px}
.vbtn[aria-pressed="false"]{background:var(--white);color:var(--muted);border-color:var(--line)}
.tabs{display:flex;gap:8px;padding:10px 16px 0;max-width:680px;margin:0 auto}
.tabs button{flex:1;border:2px solid var(--line);background:var(--white);border-radius:12px;padding:8px;font-weight:800;font-size:17px}
.tabs button[aria-pressed="true"]{background:var(--green);border-color:var(--green-ink);color:var(--green-ink)}
main{max-width:680px;margin:0 auto;padding:12px 16px 24px}
.card{background:var(--white);border:2px solid var(--blue-2);border-radius:16px;padding:16px;margin:12px 0}
.note{background:var(--yellow);border:2px solid var(--yellow-2);border-radius:14px;padding:12px 14px;margin:12px 0;white-space:pre-wrap}
.alert{background:var(--red-bg);border:2px solid var(--qred);color:var(--qred);border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:800;white-space:pre-wrap}
.q{background:var(--white);border:3px solid var(--qred);border-radius:16px;padding:14px 16px;margin:14px 0 10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qt{color:var(--qred);font-weight:900;font-size:21px;line-height:1.75;white-space:pre-wrap}
.listen{border:2px solid var(--qred);background:transparent;color:var(--qred);border-radius:12px;padding:3px 12px;font-size:16px;font-weight:800;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:2px solid var(--green-2);background:var(--green);color:var(--green-ink);border-radius:14px;padding:10px 16px;font-size:18px;font-weight:800;text-align:start;line-height:1.45}
.chip.on{background:var(--green-ink);border-color:var(--green-ink);color:#fff}
.chip.on::before{content:"✓ "}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{border:0;border-radius:10px;padding:12px 0;font-weight:900;font-size:18px;color:#fff}
.scale button.on{outline:4px solid var(--ink);outline-offset:1px}
.hint{font-size:16px;color:var(--muted);font-weight:700}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--white);font-size:19px;font-weight:700}
textarea.field{min-height:96px;resize:vertical;line-height:1.7}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{border:2px solid var(--green-ink);background:var(--green-ink);color:#fff;border-radius:14px;padding:12px 20px;font-size:19px;font-weight:900;flex:1}
.btn.light{background:var(--white);color:var(--green-ink)}
.btn.blue{background:var(--blue);border-color:#2B6C98;color:#123B57}
.btn.red{background:var(--white);border-color:var(--qred);color:var(--qred)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E}
.prog{height:10px;background:var(--white);border:2px solid var(--blue-2);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--green-2);border-left:2px solid var(--green-ink)}
.stepno{font-size:15px;color:var(--muted)}
.err{color:var(--qred);font-size:16px;font-weight:800;margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:19px}
.kv .k{color:var(--muted)}
.big{font-size:24px;font-weight:900}
.fileno{display:inline-block;background:var(--yellow);border:2px solid var(--yellow-2);border-radius:10px;padding:2px 12px;font-weight:900;letter-spacing:1px;direction:ltr}
.appt{border:3px solid var(--green-ink);background:var(--green)}
.st{display:inline-block;border-radius:10px;padding:2px 10px;font-size:16px;font-weight:800;background:var(--yellow)}
.st.ok{background:var(--green-2);color:var(--green-ink)}.st.no{background:var(--red-bg);color:var(--qred)}
.sumrow{border-top:2px dashed var(--blue-2);padding:6px 0}
.sumrow .k{color:var(--muted);font-size:16px;display:block}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--blue);border-top:2px solid var(--blue-2);text-align:center;font-size:14px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));color:var(--muted);z-index:5}
.gate{text-align:center;padding:40px 10px}
.gate .ic{font-size:56px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:9;font-size:17px;max-width:90vw}
.inst li{margin:6px 0}
.upl{display:block;text-align:center;margin:8px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.th{position:relative;width:96px;background:var(--white);border:2px solid var(--blue-2);border-radius:12px;padding:4px;text-align:center;font-size:28px}
.th img{width:100%;height:70px;object-fit:cover;border-radius:8px;display:block}
.th small{display:block;font-size:11px;line-height:1.3;word-break:break-all;color:var(--muted)}
.th .x{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--qred);color:#fff;font-size:13px;padding:0}
.dxbox{background:var(--white);border:3px solid var(--blue-2);border-radius:16px;padding:14px;margin:12px 0}
.dxp{background:var(--green);border:2px solid var(--green-2);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:900;color:var(--green-ink)}
.dxp.urg{background:var(--red-bg);border-color:var(--qred);color:var(--qred)}
.warnbig{background:var(--red-bg);border:3px solid var(--qred);color:var(--qred);border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:900;font-size:21px;line-height:1.6}
.counters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.counters span{flex:1;min-width:0;text-align:center;background:var(--white);border:2px solid var(--blue-2);border-radius:12px;padding:6px 8px;font-size:16px;font-weight:800}
.counters span.done{background:var(--green);border-color:var(--green-2);color:var(--green-ink)}
.counters b{font-size:19px}
.qcount{background:var(--green);border:2px solid var(--green-2);color:var(--green-ink);border-radius:14px;padding:10px 14px;margin:12px 0;font-weight:900;text-align:center}
.codebox{width:100%;min-height:92px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600;line-height:1.4;word-break:break-all;background:#FFFDF1;border:2px dashed var(--yellow-2);border-radius:12px;padding:10px;color:var(--ink);resize:none}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.contact a{flex:1;min-width:140px;text-align:center;text-decoration:none}
details.rev summary{cursor:pointer;font-weight:900;color:var(--green-ink)}
@media (max-width:420px){body{font-size:19px}.qt{font-size:20px}.chip{font-size:17px;padding:9px 13px}.scale button{font-size:16px;padding:10px 0}}
@media print{.top,.foot,.nav,.listen,.tabs,.vbtn{display:none!important}}
</style>
</head>

player.onended=playNext;player.onerror=playNext;

/* ---------- conditions & steps (same logic as the doctor tool) ---------- */
function isNoneish(x){const n=norm(x);return !n||['لا','لا يوجد','لا شيء','ليس لدي','لا اعرف','طبيعي','لا ينتشر','لا يؤثر'].includes(n)||/^لا (يوجد|شيء|شي)/.test(n)||n===norm(D.noneRed);}
function hasVal(v){return !(v==null||v===''||(Array.isArray(v)&&!v.length));}
function numOf(v){return parseFloat(digits(String(Array.isArray(v)?v[0]:v)).replace(/[٫,]/g,'.').replace(/[^\d.\-]/g,''));}
function matchC(c,a){const v=a[c.q];if(!hasVal(v))return false;const txt=norm(fmtVal(v));const parts=String(c.v??'').split('|').map(norm).filter(Boolean);
 switch(c.op){case 'has':return parts.some(x=>txt.includes(x));case 'not':return !parts.some(x=>txt.includes(x));
  case 'gte':{const n=numOf(v);return !isNaN(n)&&n>=+c.v;}case 'lte':{const n=numOf(v);return !isNaN(n)&&n<=+c.v;}
  case 'any':return arr(v).some(x=>!isNoneish(x));case 'none':return arr(v).every(isNoneish);}return false;}
function regKey(a){if(!a.region)return null;return Object.keys(D.regions).find(k=>D.regions[k].label===a.region)||'other';}
function steps(a,P,auto,maxMode){const L=[],R=regKey(a)?D.regions[regKey(a)]:null,M=D.msg;
 const push=q=>{if(!q||q.hidden)return;const s=Object.assign({},q);
  if(s.id==='name'&&P&&P.preN)return;
  if(s.id==='phone'&&P&&P.preP)return;
  if(s.id==='region'&&P&&P.preR)return;
  if(s.id==='region')s.opts=Object.values(D.regions).map(r=>r.label);
  if(s.id==='place'){s.opts=(P&&P.pl)||[];if(!s.opts.length)return;}
  if(!maxMode&&s.when&&s.when.length&&!s.when.every(c=>matchC(c,a))){if(auto&&s.skipAs!=null)auto[s.id]=s.skipAs;return;}
  L.push(s);
  if((s.type==='multi'||s.type==='choice')&&Array.isArray(s.opts)&&s.opts.includes(D.other)&&arr(a[s.id]).includes(D.other))
   L.push({id:s.id+'_o',label:s.label,type:'text',q:'اكتب لنا ذلك من فضلك.'});};
 D.flow.forEach(q=>{if(!q.block){push(q);return;}if(!R)return;
  if(q.id==='@loc'){if(R.side)push({id:'side',type:'choice',q:M.sideQ,opts:M.sides});
   if(R.sites&&R.sites.length)push({id:'site',type:'multi',q:M.siteQ,opts:R.sites});else push({id:'site',type:'text',q:M.siteTextQ});
   if(R.rad&&R.rad.length)push({id:'rad',type:'multi',q:M.radQ,opts:R.rad,none:R.rad[R.rad.length-1]});}
  if(q.id==='@aggr'&&R.aggr&&R.aggr.length)push({id:'aggr',type:'multi',q:M.aggrQ,opts:R.aggr.concat([M.aggrNone]),none:M.aggrNone});
  if(q.id==='@extra')(R.extra||[]).forEach(push);
  if(q.id==='@red'&&R.red&&R.red.length)push({id:'red',type:'multi',q:M.redQ,opts:R.red.concat([D.noneRed]),none:D.noneRed,red:true});});
 return L;}
/* one question per page */
function screens(a,P){return steps(a,P).map(s=>({items:[s]}));}
/* answers sent to the doctor: the patient's answers plus the safe default of every question skipped by its condition */
function fullAnswers(P){const auto={};steps(P.answers,P,auto);return Object.assign({},auto,P.answers);}
function answeredCount(P){return steps(P.answers,P).filter(s=>hasVal(P.answers[s.id])).length;}
/* expected number of questions, from the shortest to the longest pain place */
function qRange(P){const regs=P.preR?[P.answers.region]:Object.values(D.regions).map(r=>r.label);
 const n=(b,mx)=>regs.map(rg=>steps(Object.assign({},P.answers,{region:rg,book:b}),P,null,mx).length);
 return[Math.min(...n('لا')),Math.max(...n('نعم',1))];}
function counters(P,cur){const L=steps(P.answers,P),done=L.filter(s=>hasVal(P.answers[s.id])).length;
 return `<div class="counters"><span>📋 عدد الأسئلة<br><b>${L.length}</b></span><span class="done">✅ تمت الإجابة<br><b>${done}</b></span>${cur!=null?`<span>📝 السؤال الحالي<br><b>${cur+1}</b></span>`:''}</div>`;}

let tab='q',errs={};
function qBox(s){return `<div class="q"><div class="qt">${esc(s.q)}</div>${D.audio[vkey(s.q)]?`<button class="listen" data-say="${esc(s.q)}">🔊 استماع</button>`:''}</div>`;}
function input(s,a,single){const v=a[s.id];
 if(s.type==='choice')return `<div class="chips">${s.opts.map(o=>`<button class="chip ${v===o?'on':''}" data-pick="${esc(s.id)}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}</div>`;
 if(s.type==='multi')return `<div class="chips">${s.opts.map(o=>{const on=arr(v).includes(o);return `<button class="chip ${on?'on':''}" data-tog="${esc(s.id)}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`;}).join('')}</div><div class="hint">اختر كل ما ينطبق${single?' ثم اضغط التالي':''}</div>`;
 if(s.type==='scale'){const col=i=>`hsl(${120-i*12},62%,${i<4?34:40}%)`;return `<div class="scale">${[...Array(11).keys()].map(i=>`<button class="${String(v)===String(i)?'on':''}" style="background:${col(i)}" data-pick="${esc(s.id)}" data-v="${i}">${i}</button>`).join('')}</div><div class="hint">0 لا يوجد ألم، 10 أشد ألم</div>`;}
 if(s.type==='uploads'){const L=IMGS[P0()]||[];return `<label class="btn blue upl">📎 اختيار صور أو ملفات<input type="file" id="upIn" accept="image/*,application/pdf" multiple hidden></label>
  <div class="thumbs">${L.map((f,i)=>`<span class="th">${f.type.startsWith('image/')?`<img src="${f._u}" alt="">`:'📄'}<small>${esc(f.name)}</small><button class="x" data-rmimg="${i}" aria-label="حذف">✕</button></span>`).join('')}</div>
  <div class="hint">${L.length?'أُرفق '+L.length+' ملف. يمكنك إضافة المزيد أو الضغط على «تم».':'إذا لم تكن لديك تقارير، اضغط «تم» مباشرة.'}</div>`;}
 if(s.type==='number')return `<input class="field" data-in="${esc(s.id)}" inputmode="decimal" dir="ltr" value="${hasVal(v)?esc(v):''}" placeholder="${esc(s.unit||'')}">`;
 const long=/meds|surg|restext|prevdate|_o$|site/.test(s.id);
 return (long?`<textarea class="field" data-in="${esc(s.id)}">${esc(hasVal(v)?v:'')}</textarea>`:`<input class="field" data-in="${esc(s.id)}" ${s.id==='phone'?'inputmode="tel" dir="ltr"':''} value="${hasVal(v)?esc(v):''}">`)+
  (s.quick?`<div class="chips">${s.quick.map(o=>`<button class="chip ${v===o?'on':''}" data-pick="${esc(s.id)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:'');}
function validate(s,a){const v=a[s.id];
 if(!hasVal(v)||(typeof v==='string'&&!v.trim()))return s.type==='multi'?'اختر جواباً واحداً على الأقل.':'هذا السؤال مطلوب.';
 if(s.id==='name'&&String(v).trim().split(/\s+/).length<3)return D.msg.nameErr;
 if(s.id==='phone'&&digits(v).replace(/\D/g,'').length<8)return 'نرجو كتابة رقم هاتف صحيح من فضلك.';
 if(s.type==='number'){const n=numOf(v);if(isNaN(n)||(s.min!=null&&n<s.min)||(s.max!=null&&n>s.max))return 'اكتب رقماً صحيحاً.';}
 return '';}
function render(){
 const P=prof();
 $('#tabs').hidden=true;
 if(!P){$('#main').innerHTML=`<div class="gate"><div class="ic">🔗</div><p class="big">افتح التطبيق من الرابط</p><p>أرسلت لك العيادة رابطاً على واتساب. افتحه من هناك ليظهر ملفك.</p></div>`;return;}
 /* once an appointment arrives, the app shows the appointment only */
 if(P.appts&&P.appts.length){renderAppts(P);return;}
 if(P.sentAt){renderFinish(P);return;}
 if(P.e&&Date.now()>P.e){$('#main').innerHTML=`<div class="gate"><div class="ic">⏳</div><p class="big">انتهت صلاحية هذا الرابط</p><p>تواصل مع العيادة على واتساب ليصلك رابط جديد.</p></div>`;return;}
 const a=P.answers,SC=screens(a,P);
 if(P.screen<0){renderWelcome(P);return;}
 if(P.screen>=SC.length){renderFinish(P);return;}
 const s=SC[P.screen].items[0];
 const pct=Math.round(100*answeredCount(P)/SC.length);
 const auto=s.type==='choice'||s.type==='scale';
 $('#main').innerHTML=`${counters(P,P.screen)}<div class="prog"><i style="width:${pct}%"></i></div>
 <section data-sid="${esc(s.id)}">${qBox(s)}${input(s,a,true)}${errs[s.id]?`<div class="err">${esc(errs[s.id])}</div>`:''}${s.red&&arr(a.red).some(x=>x!==D.noneRed)?`<div class="alert">${esc(D.msg.alert)}</div>`:''}</section>
 ${auto?'<div class="hint" style="margin-top:8px">اضغط على إجابتك، وسينتقل التطبيق إلى السؤال التالي تلقائياً.</div>':''}
 <div class="nav"><button class="btn light" data-go="back">→ السابق</button>${s.type==='uploads'?'<button class="btn" data-go="filesdone">تم ✓</button>':auto?'':'<button class="btn" data-go="next">إرسال ←</button>'}</div>`;
}

/* the patient's code: everything he answered, sealed; it is what reaches the doctor */
async function qaCode(P){const a=fullAnswers(P),key=JSON.stringify(a);
 if(P.code&&P.codeKey===key)return P.code;
 P.code='YKQ1.'+await seal({v:1,t:'qa',id:P.id,f:P.f,c:P.key,a,ts:Date.now()},KEY);P.codeKey=key;save();return P.code;}
function codeCard(code,title,note){return `<div class="card"><b>🔐 ${esc(title)}</b><p class="hint" style="margin:4px 0 8px">${esc(note)}</p>
 <textarea class="codebox" readonly aria-label="${esc(title)}">${esc(code||'...')}</textarea>
 <div class="nav" style="margin-top:8px"><button class="btn light" data-copy="1">📋 نسخ الكود</button></div></div>`;}
/* preliminary diagnosis shown to the patient (rules copied from the doctor's program, without lab and imaging results) */
function pDx(P){const a=fullAnswers(P),h=+a.height,w=+a.weight;if(h&&w)a.bmi=w/((h/100)**2);
 const k=regKey(a),L=(k&&D.regions[k]&&D.regions[k].dx)||[];
 const R=L.map(d=>{let s=0,ok=true;d.c.forEach(([q,op,v,wt,req])=>{if(matchC({q,op,v},a))s+=wt;else if(req)ok=false;});return{d,s,ok:ok&&s>=d.min};}).filter(x=>x.ok).sort((x,y)=>y.s-x.s);
 return{urg:R.filter(x=>x.d.u),top:R.filter(x=>!x.d.u).slice(0,2)};}
function dxHTML(P){const X=pDx(P),urgRed=arr(P.answers.red).some(x=>x!==D.noneRed);
 const list=X.urg.map(x=>`<div class="dxp urg">⚠️ ${esc(x.d.n)}</div>`).join('')+X.top.map((x,i)=>`<div class="dxp">${i+1}. ${esc(x.d.n)}</div>`).join('');
 return `<div class="dxbox"><b style="font-size:22px">🩺 احتمالات التشخيص الأولية</b>
 ${list||'<p>لم تتضح من إجاباتك احتمالات كافية، وسيحدد الطبيب التشخيص بعد الفحص.</p>'}
 ${X.urg.length||urgRed?`<div class="alert">${esc(D.msg.alert)}</div>`:''}
 <div class="warnbig">⚠️ تنبيه مهم: هذا التشخيص أوّلي وغير نهائي، ولا يُعتمد عليه في العلاج أو تناول أي دواء. لا بد من مراجعة الطبيب المختص وإجراء الفحص السريري.</div></div>`;}

 <details class="card rev"><summary>📝 مراجعة إجاباتي (${L.length})</summary>${L.map(s=>`<div class="sumrow"><span class="k">${esc(s.q.split('\n')[0])}</span>${esc(fmtVal(a[s.id]))}</div>`).join('')}

 if(!ok)qaCode(P).then(c=>{const t=document.querySelector('.codebox');if(t)t.value=c;});

/* ---------- appointments ---------- */
const DAYS=D.days,MONTHS=D.months;
function dParts(ds){const d=new Date(ds+'T00:00');return{wd:DAYS[d.getDay()],day:d.getDate(),mon:MONTHS[d.getMonth()],yr:d.getFullYear()};}
function periodOf(h){return h<12?'صباحاً':h===12?'ظهراً':'مساءً';}
function fmtHour(t){const [h,m]=t.split(':').map(Number);return (((h+11)%12)+1)+':'+pad(m)+' '+periodOf(h);}
function hourParts(t){let [h,m]=t.split(':').map(Number);let mp='';if(m===15)mp='والربع';else if(m===30)mp='والنصف';else if(m===45){mp='إلا ربعاً';h=(h+1)%24;}else if(m!==0)return[];
 return ['الساعة '+D.hourw[((h+11)%12)+1]].concat(mp?[mp]:[],[periodOf(h)]);}
function apptParts(P,x){const d=dParts(x.d);return [x.ch?D.msg.bkChanged:D.msg.bkIntro,'يوم '+d.wd,D.ord[d.day]+' من',d.mon].concat(hourParts(x.tm),['في '+x.pl,D.msg.fileNo1],[...String(P.f||'')].map(c=>D.digw[+c]),[D.msg.bkBring,D.msg.bkAsk]);}

  <div class="nav"><button class="btn blue" data-ics="${esc(x.b)}">📅 أضف الموعد إلى تقويم الهاتف</button></div>`}</div>`;};
 $('#main').innerHTML=card(L[0],0)+
  (P.recCode?codeCard(P.recCode,'كود ملفك المحدَّث','يحمل معلومات ملفك مع الموعد والعلاج والملاحظات مشفرة. احتفظ به، ولا تعدّله.'):'')+
  (L.length>1?`<details class="card rev"><summary>المواعيد السابقة (${L.length-1})</summary>${L.slice(1).map((x,i)=>card(x,i+1)).join('')}</details>`:'');
}
function ics(P,x){const [h,m]=x.tm.split(':').map(Number),d=x.d.replace(/-/g,''),e=new Date(2000,0,1,h,m+30);
 const T=s=>s.replace(/[,;\\]/g,c=>'\\'+c);
 const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//YK Clinic//AR','BEGIN:VEVENT','UID:'+x.b+'@yk-clinic','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
  'DTSTART:'+d+'T'+pad(h)+pad(m)+'00','DTEND:'+d+'T'+pad(e.getHours())+pad(e.getMinutes())+'00','SUMMARY:'+T('موعد عيادة الدكتور ياسر الخزرجي'),'LOCATION:'+T(x.pl),
  'DESCRIPTION:'+T('رقم الملف: '+P.f),'BEGIN:VALARM','TRIGGER:-PT3H','ACTION:DISPLAY','DESCRIPTION:'+T('موعدك اليوم'),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download='موعد-العيادة.ics';document.body.appendChild(a);a.click();a.remove();}
/* ---------- sending back to the clinic (WhatsApp, coded) ---------- */
function waUrl(num,text){return 'https://wa.me/'+String(num||'').replace(/\D/g,'')+'?text='+encodeURIComponent(text);}
async function sendAnswers(P){
 const a=P.answers,code=await qaCode(P);
 const msg=`السلام عليكم، أكملت أسئلة عيادة الدكتور ياسر الخزرجي.\nالاسم: ${a.name||P.n||''}${P.f?'\nرقم الملف: '+P.f:''}${/نعم/.test(a.book||'')?'\nأرغب بحجز موعد'+(a.place?' في '+String(a.place).split(' (')[0]:''):''}\n\nكود الملف (يُرجى عدم تعديله):\n${code}`;
 if(!P.w){toast('رقم واتساب العيادة غير موجود في الرابط. تواصل مع العيادة.');return;}
 P.sentAt=Date.now();save();location.href=waUrl(P.w,msg);setTimeout(render,400);}
async function sendReply(P,bid,ans){
 const x=P.appts.find(z=>z.b===bid);if(!x)return;
 const code=await seal({v:1,t:'ar',id:P.id,f:P.f,b:bid,x:ans,ts:Date.now()},KEY);
 const msg=`${D.ans[ans]}\nالاسم: ${P.n||P.answers.name||''}\nرقم الملف: ${P.f}\nالموعد: ${dParts(x.d).wd} ${x.d} ${fmtHour(x.tm)}، ${x.pl}\n\nرمز الرد (يُرجى عدم تعديله):\nYKR1.${code}`;
 x.r=ans;x.rAt=Date.now();save();say([ans==='yes'?D.msg.bkYes:ans==='change'?D.msg.bkChange:D.msg.bkNo]);
 location.href=waUrl(P.w,msg);setTimeout(render,400);}
/* ---------- events ---------- */
function readInputs(P){document.querySelectorAll('[data-in]').forEach(el=>{const id=el.dataset.in,v=el.value.trim();if(v)P.answers[id]=id==='phone'?digits(v):v;else delete P.answers[id];});}
function clearSkipped(P){const ids=new Set(steps(P.answers,P).map(s=>s.id));const keep=new Set(['name','phone','region']);Object.keys(P.answers).forEach(k=>{if(!ids.has(k)&&!keep.has(k))delete P.answers[k];});}
function speakScreen(P){const SC=screens(P.answers,P);const sc=SC[P.screen];if(sc)say(sc.items.filter(s=>!hasVal(P.answers[s.id])).slice(0,1).map(s=>s.q));}
function go(dir){const P=prof();readInputs(P);clearSkipped(P);const SC=screens(P.answers,P);
 if(dir>0&&P.screen>=0&&P.screen<SC.length){errs={};SC[P.screen].items.forEach(s=>{const e=validate(s,P.answers);if(e)errs[s.id]=e;});if(Object.keys(errs).length){render();toast('أكمل الإجابة من فضلك.');return;}}
 errs={};P.screen=Math.max(-1,Math.min(SC.length,P.screen+dir));save();render();window.scrollTo(0,0);if(P.screen>=0&&P.screen<SC.length)speakScreen(P);}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const P=prof();
 if(t.dataset.say){say([t.dataset.say],true);return;}
 if(t.dataset.tab){tab=t.dataset.tab;render();return;}
 if(t.dataset.tabgo){tab=t.dataset.tabgo;render();return;}
 if(t.dataset.copy){const box=document.querySelector('.codebox');const v=box?box.value:'';if(!v||v==='...')return;try{await navigator.clipboard.writeText(v);toast('تم نسخ الكود.');}catch(err){box.select();toast('حدّد النص وانسخه يدوياً.');}return;}
 if(!P)return;
 if(t.dataset.appt!=null){const L=P.appts.slice().sort((x,y)=>y.at-x.at);say(apptParts(P,L[+t.dataset.appt]),true);return;}
 if(t.dataset.ics){const x=P.appts.find(z=>z.b===t.dataset.ics);if(x)ics(P,x);return;}
 if(t.dataset.reply){if(t.dataset.reply!=='yes'&&!confirm(t.dataset.reply==='no'?'هل أنت متأكد أنك لا تستطيع الحضور؟':'هل تريد تأجيل الموعد؟ سيحدد لك السكرتير أقرب موعد متاح بعده.'))return;stopVoice();await sendReply(P,t.dataset.b,t.dataset.reply);return;}
 const g=t.dataset.go;
 if(g==='start'){P.screen=0;save();render();speakScreen(P);return;}
 if(g==='install'&&window._bip){window._bip.prompt();return;}
 if(g==='back'){stopVoice();go(-1);return;}
 if(g==='next'){stopVoice();go(1);return;}
 if(g==='send'||g==='resend'){stopVoice();await sendAnswers(P);return;}
 if(g==='shareimg'){await shareImgs(P);return;}
 if(g==='filesdone'){const L=IMGS[P0()]||[];P.answers.files=L.length?L.length+' صورة أو ملف: '+L.map(f=>f.name).join('، '):'لا توجد تقارير';save();stopVoice();go(1);return;}
 if(t.dataset.rmimg!=null){const L=IMGS[P0()]||[];L.splice(+t.dataset.rmimg,1);render();return;}
 if(t.dataset.pick){stopVoice();readInputs(P);const id=t.dataset.pick,v=t.dataset.v;P.answers[id]=/^\d+$/.test(v)&&t.closest('.scale')?+v:v;delete errs[id];save();
  {const el=document.querySelector('[data-in="'+CSS.escape(id)+'"]');if(el)el.value=v;}
  const SC=screens(P.answers,P),sc=SC[P.screen];
  if(sc&&sc.items.length===1&&sc.items[0].id===id&&sc.items[0].type!=='multi'){go(1);return;}
  render();return;}
 if(t.dataset.tog){readInputs(P);const id=t.dataset.tog,v=t.dataset.v,SC=screens(P.answers,P),s=SC[P.screen].items.find(x=>x.id===id);let cur=arr(P.answers[id]).slice();
  if(s&&s.none&&v===s.none)cur=cur.includes(v)?[]:[v];else{cur=cur.filter(x=>x!==(s&&s.none));cur=cur.includes(v)?cur.filter(x=>x!==v):cur.concat(v);}
  if(cur.length)P.answers[id]=cur;else delete P.answers[id];delete errs[id];save();render();
  if(s&&s.red&&cur.some(x=>x!==D.noneRed))say([D.msg.alert],false);return;}
});
document.addEventListener('change',e=>{if(e.target.id!=='upIn')return;const L=IMGS[P0()]||(IMGS[P0()]=[]);
 [...e.target.files].forEach(f=>{if(L.length>=20)return;f._u=f.type.startsWith('image/')?URL.createObjectURL(f):'';L.push(f);});e.target.value='';render();});
document.addEventListener('input',e=>{const P=prof();if(P&&e.target.dataset.in){readInputs(P);save();}});
document.addEventListener('copy',e=>{if(!e.target.closest||!e.target.closest('input,textarea'))e.preventDefault();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._bip=e;});
/* ---------- start: read the link ---------- */
(async()=>{
 const d=new URLSearchParams(location.search).get('d');
 if(d){try{const L=await unseal(d,KEY);
   if(L.t==='q'){const P=ensureProfile(L);if(P.screen===undefined)P.screen=-1;if(!P.sentAt&&!Object.keys(P.answers).filter(k=>!['name','phone','region'].includes(k)).length)P.screen=-1;tab='q';}
   if(L.t==='a'){const P=ensureProfile({id:L.id,f:L.f,n:L.n,w:L.w,ph:L.ph,c:L.c});P.sentAt=P.sentAt||1;
    if(!P.appts.some(x=>x.b===L.b))P.appts.push({b:L.b,d:L.d,tm:L.tm,pl:L.pl,nt:L.nt||'',pp:L.pp||'',pm:L.pm||'',ch:L.ch?1:0,at:Date.now()});
    /* the updated file (answers, appointments, treatment and notes) arrives sealed with the appointment */
    if(L.r&&(!P.recTs||(L.r.ts||0)>=P.recTs)){P.recTs=L.r.ts||Date.now();P.recCode='YKP1.'+await seal(L.r,KEY);}
    tab='a';save();render();const L2=P.appts.slice().sort((x,y)=>y.at-x.at);setTimeout(()=>say(apptParts(P,L2[0])),300);return;}
   save();}catch(e){$('#main').innerHTML=`<div class="gate"><div class="ic">⚠️</div><p class="big">تعذّر فتح الرابط</p><p>تأكد أنك فتحت الرابط كاملاً كما وصلك من العيادة.</p></div>`;return;}}
 else{const ks=Object.keys(S.profiles);if(ks.length&&!S.cur)S.cur=ks[ks.length-1];const P=prof();if(P&&P.appts.length)tab='a';}
 const P=prof();if(P&&P.screen===undefined)P.screen=-1;
 /* resume at the first unanswered question (one question per page) */
 if(P&&!P.sentAt&&P.screen>=0){const L=steps(P.answers,P);const i=L.findIndex(s=>!hasVal(P.answers[s.id]));P.screen=i<0?L.length:i;save();}
 render();
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
